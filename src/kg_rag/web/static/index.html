<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph RAG</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e4e6eb;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 24px;
      border-bottom: 1px solid #1f232b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 16px;
    }
    header h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: #c9cdd6;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #161a22;
      border-radius: 8px;
      padding: 3px;
    }
    .tab {
      background: transparent;
      color: #8b94a3;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover { color: #e4e6eb; }
    .tab.active { background: #2a3142; color: #e4e6eb; }
    #status {
      font-size: 12px;
      color: #8b94a3;
      font-variant-numeric: tabular-nums;
    }
    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    aside {
      width: 300px;
      border-right: 1px solid #1f232b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }
    #drop-area {
      flex-shrink: 0;
      height: 200px;
      border: 2px dashed #2a2f3a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #6b7382;
      font-size: 13px;
      line-height: 1.5;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      user-select: none;
    }
    #drop-area:hover { border-color: #3a4252; color: #8b94a3; }
    #drop-area.over { border-color: #4a90e2; color: #e4e6eb; background: #131720; }
    #drop-area.busy { border-color: #c9a227; color: #c9a227; cursor: wait; }
    #drop-area .hint { font-size: 11px; color: #4a5160; margin-top: 8px; }
    #progress {
      display: none;
      margin-top: 4px;
    }
    #progress.visible { display: block; }
    #progress .bar {
      height: 4px;
      background: #1f232b;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    #progress .fill {
      height: 100%;
      background: #4a90e2;
      width: 0%;
      transition: width 0.3s ease;
    }
    #progress.indeterminate .fill {
      width: 35%;
      background: #c9a227;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(285%); }
    }
    #progress .label {
      margin-top: 6px;
      font-size: 11px;
      color: #8b94a3;
      font-variant-numeric: tabular-nums;
    }
    .file-list {
      list-style: none;
      font-size: 12px;
      color: #8b94a3;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .file-list li {
      padding: 8px 0;
      border-top: 1px solid #1f232b;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .file-list li:first-child { border-top: none; }
    .file-list .ok { color: #4ea860; flex-shrink: 0; }
    .file-list .err { color: #e25c5c; flex-shrink: 0; }
    .file-list .pending { color: #c9a227; flex-shrink: 0; }
    .file-list .name { word-break: break-all; }
    .file-list .meta { color: #4a5160; font-size: 11px; }
    .file-list .del { margin-left: auto; background: none; border: none; padding: 0; color: #3a4050; cursor: pointer; line-height: 1; flex-shrink: 0; display: flex; align-items: center; opacity: 0; transition: opacity 0.15s, color 0.15s; }
    .file-list li:hover .del { opacity: 1; }
    .file-list .del:hover { color: #e25c5c; }
    #confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: center; justify-content: center; }
    #confirm-overlay.visible { display: flex; }
    #confirm-box { background: #161a22; border: 1px solid #2a2f3a; border-radius: 10px; padding: 24px 28px; width: 300px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    #confirm-box p { font-size: 13px; color: #c9cdd6; line-height: 1.5; text-align: center; }
    #confirm-box .actions { display: flex; gap: 8px; justify-content: center; align-items: center; }
    #confirm-box button { display: inline-block; height: 32px; line-height: 32px; padding: 0 16px; border-radius: 6px; border: none; font-size: 12px; font-family: inherit; cursor: pointer; transition: background 0.15s; -webkit-appearance: none; appearance: none; vertical-align: middle; }
    #confirm-cancel { background: #1f232b; color: #8b94a3; }
    #confirm-cancel:hover { background: #2a2f3a; color: #c9cdd6; }
    #confirm-ok { background: #7a2020; color: #f0c0c0; }
    #confirm-ok:hover { background: #a02828; color: #fff; }

    .view {
      flex: 1;
      min-width: 0;
      display: none;
    }
    .view.active { display: flex; }

    #graph {
      flex: 1;
      background: #0f1115;
      min-width: 0;
    }
    #graph-empty {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a5160;
      font-size: 13px;
    }

    #view-chat.active { display: flex; flex-direction: row; }
    #doc-pane {
      width: 52%;
      min-width: 320px;
      border-right: 1px solid #1f232b;
      display: flex;
      flex-direction: column;
      background: #0b0d12;
    }
    #doc-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #1f232b;
      font-size: 12px;
      color: #8b94a3;
      flex-shrink: 0;
    }
    #doc-title {
      flex: 1;
      color: #8b94a3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #doc-text-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }
    #doc-empty {
      color: #4a5160;
      font-size: 13px;
      text-align: center;
      padding: 24px;
      line-height: 1.5;
    }
    #doc-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.65;
      color: #d0d4dc;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-width: 720px;
      margin: 0 auto;
    }
    .doc-page-marker {
      text-align: center;
      color: #4a5160;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.5px;
      margin: 28px 0 16px;
      border-top: 1px solid #1f232b;
      padding-top: 16px;
    }
    .doc-page-marker:first-child { margin-top: 0; border-top: none; padding-top: 0; }
    .doc-page-text { margin-bottom: 8px; }
    mark.doc-highlight {
      background: rgba(201, 162, 39, 0.45);
      color: inherit;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.35);
    }
    .cite {
      display: inline;
      color: #7aa2f7;
      cursor: pointer;
      font-style: italic;
      text-decoration: none;
      padding: 0 1px;
      border-radius: 3px;
      transition: background 0.12s;
    }
    .cite:hover { background: rgba(122, 162, 247, 0.15); text-decoration: underline; }
    .cite.broken {
      color: #6b7382;
      font-style: italic;
      cursor: not-allowed;
    }

    #chat {
      flex-direction: column;
      background: #0f1115;
    }
    #chat-toolbar {
      display: flex;
      align-items: center;
      padding: 6px 16px 0;
    }
    #chat-clear {
      background: none;
      border: none;
      color: #4a5160;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      transition: color 0.15s, background 0.15s;
    }
    #chat-clear:hover { color: #e25c5c; background: rgba(226,92,92,0.08); }
    #chat-clear svg { flex-shrink: 0; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #chat-empty {
      margin: auto;
      color: #4a5160;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
    #chat-empty .examples {
      margin-top: 16px;
      font-size: 12px;
      color: #3a4252;
    }
    .msg {
      max-width: 720px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
    }
    .msg.user { white-space: pre-wrap; }
    .msg.assistant.pending,
    .msg.assistant.error { white-space: pre-wrap; }
    .msg-body > *:first-child { margin-top: 0; }
    .msg-body > *:last-child { margin-bottom: 0; }
    .msg-body p { margin: 0 0 8px; }
    .msg-body ul, .msg-body ol { margin: 4px 0 8px 20px; }
    .msg-body li { margin: 2px 0; }
    .msg-body strong { color: #e4e6eb; }
    .msg-body code {
      background: #0f1115;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12.5px;
    }
    .msg-body a { color: #7aa2f7; text-decoration: underline; }
    .msg.user {
      align-self: flex-end;
      background: #2a3142;
      color: #e4e6eb;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #161a22;
      color: #c9cdd6;
      border: 1px solid #1f232b;
      border-bottom-left-radius: 4px;
    }
    .msg.assistant.error {
      border-color: #4a2027;
      color: #e25c5c;
    }
    .msg.assistant.pending { color: #6b7382; font-style: italic; }
    .msg-meta {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #1f232b;
      font-size: 11px;
      color: #4a5160;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .msg-meta .chip {
      background: #0f1115;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1f232b;
    }

    #chat-input-wrap {
      border-top: 1px solid #1f232b;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1;
      background: #161a22;
      border: 1px solid #1f232b;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e4e6eb;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 42px;
      max-height: 160px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
    }
    #chat-input:focus { border-color: #4a90e2; }
    #chat-input:disabled { opacity: 0.6; cursor: not-allowed; }
    #chat-send {
      background: #4a90e2;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
      height: 42px;
      transition: background 0.15s, opacity 0.15s;
    }
    #chat-send:hover:not(:disabled) { background: #5a9ce8; }
    #chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Graph RAG · <span style="font-weight:400">Hendrik Braun</span></h1>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-graph" data-view="graph" role="tab">Graph</button>
      <button class="tab active" id="tab-chat" data-view="chat" role="tab">Chat</button>
    </div>
    <span id="status">bereit</span>
  </header>
  <main>
    <aside>
      <div id="drop-area">
        <div>PDFs hierhin ziehen</div>
        <div class="hint">oder klicken zum Auswählen</div>
      </div>
      <input type="file" id="file-input" accept="application/pdf" multiple hidden />
      <div id="progress">
        <div class="bar"><div class="fill"></div></div>
        <div class="label"></div>
      </div>
      <ul class="file-list" id="files"></ul>
    </aside>
    <section id="view-graph" class="view">
      <div id="graph">
        <div id="graph-empty">noch keine Entitäten</div>
      </div>
    </section>
    <section id="view-chat" class="view active">
      <div id="doc-pane">
        <div id="doc-toolbar">
          <span id="doc-title">Quelle</span>
        </div>
        <div id="doc-text-wrap">
          <div id="doc-empty">
            Klicke auf eine Quelle wie [Q1] in einer Antwort, um den passenden Abschnitt zu sehen.
          </div>
          <article id="doc-text" hidden></article>
        </div>
      </div>
      <div id="chat" style="display:flex; flex:1; flex-direction:column; min-width:0;">
        <div id="chat-toolbar">
          <button id="chat-clear" title="Chatverlauf löschen">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 3.5h10M5 3.5V2.5h3v1M2.5 3.5l.6 7h4.8l.6-7"/>
            </svg>
            Verlauf löschen
          </button>
        </div>
        <div id="chat-messages">
          <div id="chat-empty">
            Stelle eine Frage zu den indexierten PDFs.
          </div>
        </div>
        <div id="chat-input-wrap">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Frage stellen … (Enter zum Senden, Shift+Enter für Zeilenumbruch)"
          ></textarea>
          <button id="chat-send" type="button">Senden</button>
        </div>
      </div>
    </section>
  </main>
  <div id="confirm-overlay">
    <div id="confirm-box">
      <p id="confirm-msg">PDF aus dem Kontext entfernen?</p>
      <div class="actions">
        <button id="confirm-cancel">Abbrechen</button>
        <button id="confirm-ok">Entfernen</button>
      </div>
    </div>
  </div>
  <script>
    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('file-input');
    const statusEl = document.getElementById('status');
    const filesEl = document.getElementById('files');
    const graphEl = document.getElementById('graph');
    const emptyEl = document.getElementById('graph-empty');
    const tabs = document.querySelectorAll('.tab');
    const views = {
      graph: document.getElementById('view-graph'),
      chat: document.getElementById('view-chat'),
    };
    const chatMessages = document.getElementById('chat-messages');
    const chatEmpty = document.getElementById('chat-empty');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatClear = document.getElementById('chat-clear');
    const docEmpty = document.getElementById('doc-empty');
    const docTextEl = document.getElementById('doc-text');
    const docTitleEl = document.getElementById('doc-title');

    let network = null;
    let chatBusy = false;

    const SESSION_STORAGE_KEY = 'kg-rag-session-id';
    function generateSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
    function getSessionId() {
      let id = sessionStorage.getItem(SESSION_STORAGE_KEY);
      if (!id) {
        id = generateSessionId();
        sessionStorage.setItem(SESSION_STORAGE_KEY, id);
      }
      return id;
    }
    const sessionId = getSessionId();

    function sessionHeaders(extra) {
      return Object.assign({ 'X-Session-Id': sessionId }, extra || {});
    }

    const textViewer = {
      documentId: null,
      pagesByNumber: new Map(),
      knownDocs: new Map(),

      registerDoc(documentId, title) {
        if (documentId) this.knownDocs.set(documentId, title || documentId);
      },

      async open(documentId, page, snippet) {
        if (!documentId) return;
        if (documentId !== this.documentId) {
          const ok = await this.load(documentId);
          if (!ok) return;
        }
        const pageNum = parseInt(page, 10) || 1;
        this.scrollToPage(pageNum);
        if (snippet) {
          setTimeout(() => this.highlight(snippet, pageNum), 120);
        }
      },

      async load(documentId) {
        docEmpty.textContent = 'Lädt …';
        docEmpty.hidden = false;
        docTextEl.hidden = true;
        try {
          const res = await fetch(
            '/api/document/' + encodeURIComponent(documentId) + '/text',
            { headers: sessionHeaders() }
          );
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this.documentId = documentId;
          docTitleEl.textContent = this.knownDocs.get(documentId) || data.title || documentId;
          this.render(data.pages || []);
          return true;
        } catch (err) {
          console.warn('Dokument-Text konnte nicht geladen werden:', err);
          docEmpty.textContent = 'Text konnte nicht geladen werden.';
          docEmpty.hidden = false;
          docTextEl.hidden = true;
          return false;
        }
      },

      render(pages) {
        docTextEl.replaceChildren();
        this.pagesByNumber.clear();
        for (const p of pages) {
          const marker = document.createElement('div');
          marker.className = 'doc-page-marker';
          marker.textContent = '— Seite ' + p.page_number + ' —';
          const section = document.createElement('section');
          section.className = 'doc-page-text';
          section.dataset.pageNumber = String(p.page_number);
          section.textContent = p.text;
          docTextEl.append(marker, section);
          this.pagesByNumber.set(p.page_number, section);
        }
        docEmpty.hidden = true;
        docTextEl.hidden = false;
      },

      scrollToPage(page) {
        const section = this.pagesByNumber.get(page);
        if (section) section.scrollIntoView({ block: 'start', behavior: 'smooth' });
      },

      highlight(snippet, page) {
        docTextEl.querySelectorAll('mark.doc-highlight').forEach(mark => {
          const parent = mark.parentNode;
          while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
          parent.removeChild(mark);
          parent.normalize();
        });
        const needle = snippet.toLowerCase().replace(/\s+/g, ' ').trim();
        if (needle.length < 4) return;
        const targetPage = parseInt(page, 10) || 1;
        const section = this.pagesByNumber.get(targetPage);
        if (!section) return;
        // Anchor-based matching: find the lead and trail phrase on the page and
        // span between them. Tolerates interior whitespace/hyphenation drift.
        for (const anchorSize of [8, 5, 3]) {
          if (this._markWithAnchors(section, needle, anchorSize)) return;
        }
        // Last resort: highlight the sentence with the highest token overlap.
        this._markBestSentence(section, needle);
      },

      _markWithAnchors(section, needle, anchorSize) {
        const textNode = section.firstChild;
        if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return false;
        const raw = textNode.nodeValue;
        const norm = raw.toLowerCase().replace(/\s+/g, ' ');
        const words = needle.split(' ');
        const n = Math.min(anchorSize, words.length);
        const leadPhrase = words.slice(0, n).join(' ');
        const trailPhrase = words.slice(words.length - n).join(' ');
        const leadIdx = norm.indexOf(leadPhrase);
        if (leadIdx < 0) return false;
        // When lead === trail (short needle) reuse the same match position.
        const trailIdx = leadPhrase === trailPhrase
          ? leadIdx
          : norm.indexOf(trailPhrase, leadIdx);
        if (trailIdx < 0) return false;
        const [origStart, origEnd] = this._normToOrigRange(raw, leadIdx, trailIdx + trailPhrase.length);
        return this._applyMark(textNode, origStart, origEnd);
      },

      _markBestSentence(section, needle) {
        const textNode = section.firstChild;
        if (!textNode || textNode.nodeType !== Node.TEXT_NODE) return;
        const raw = textNode.nodeValue;
        const needleTokens = needle.split(' ').filter(w => w.length > 3);
        if (needleTokens.length === 0) return;
        const needleSet = new Set(needleTokens);
        let bestScore = 0, bestStart = -1, bestEnd = -1;
        const re = /[^.!?\n]+[.!?\n]+/g;
        let m;
        while ((m = re.exec(raw)) !== null) {
          const tokens = m[0].toLowerCase().replace(/\s+/g, ' ').split(' ').filter(w => w.length > 3);
          const score = tokens.filter(t => needleSet.has(t)).length / needleSet.size;
          if (score > bestScore) {
            bestScore = score;
            bestStart = m.index;
            bestEnd = m.index + m[0].length;
          }
        }
        if (bestScore >= 0.25 && bestStart >= 0) this._applyMark(textNode, bestStart, bestEnd);
      },

      _applyMark(textNode, origStart, origEnd) {
        if (origStart < 0 || origEnd <= origStart || origEnd > textNode.nodeValue.length) return false;
        const range = document.createRange();
        range.setStart(textNode, origStart);
        range.setEnd(textNode, origEnd);
        const mark = document.createElement('mark');
        mark.className = 'doc-highlight';
        try {
          range.surroundContents(mark);
          mark.scrollIntoView({ block: 'center', behavior: 'smooth' });
          return true;
        } catch (_) {
          return false;
        }
      },

      _normToOrigRange(original, normStart, normEnd) {
        const normToOrig = [];
        let inSpaceRun = false;
        for (let i = 0; i < original.length; i++) {
          const isSpace = /\s/.test(original[i]);
          if (isSpace) {
            if (!inSpaceRun) { normToOrig.push(i); inSpaceRun = true; }
          } else {
            normToOrig.push(i); inSpaceRun = false;
          }
        }
        const origStart = normToOrig[normStart] ?? -1;
        const lastOrig = normToOrig[normEnd - 1] ?? -1;
        return [origStart, lastOrig >= 0 ? lastOrig + 1 : -1];
      },
    };

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.style.color = kind === 'error' ? '#e25c5c'
        : kind === 'busy' ? '#c9a227'
        : '#8b94a3';
    }

    function switchView(name) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
      Object.entries(views).forEach(([key, el]) => {
        el.classList.toggle('active', key === name);
      });
      if (name === 'chat') {
        chatInput.focus();
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchView(tab.dataset.view));
    });

    const confirmOverlay = document.getElementById('confirm-overlay');
    const confirmCancel = document.getElementById('confirm-cancel');
    const confirmOk = document.getElementById('confirm-ok');
    let _confirmResolve = null;
    function showConfirm() {
      confirmOverlay.classList.add('visible');
      return new Promise(resolve => { _confirmResolve = resolve; });
    }
    confirmOk.addEventListener('click', () => { confirmOverlay.classList.remove('visible'); _confirmResolve && _confirmResolve(true); });
    confirmCancel.addEventListener('click', () => { confirmOverlay.classList.remove('visible'); _confirmResolve && _confirmResolve(false); });
    confirmOverlay.addEventListener('click', (e) => { if (e.target === confirmOverlay) { confirmOverlay.classList.remove('visible'); _confirmResolve && _confirmResolve(false); } });

    filesEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      const li = btn.closest('li');
      const documentId = li && li.dataset.documentId;
      if (!documentId) return;
      if (!await showConfirm()) return;
      btn.disabled = true;
      try {
        const res = await fetch(`/api/document/${documentId}`, {
          method: 'DELETE',
          headers: sessionHeaders(),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          setStatus(`Fehler beim Löschen: ${data.detail || res.statusText}`, 'error');
          btn.disabled = false;
          return;
        }
        li.remove();
        textViewer.knownDocs.delete(documentId);
        await loadGraph();
        setStatus('PDF aus Kontext entfernt');
      } catch (err) {
        setStatus(`Fehler beim Löschen: ${err.message}`, 'error');
        btn.disabled = false;
      }
    });

    function addFileEntry(name, meta, ok, documentId) {
      const li = document.createElement('li');
      const mark = document.createElement('span');
      mark.className = ok ? 'ok' : 'err';
      mark.textContent = ok ? '✓' : '✕';
      const nameEl = document.createElement('span');
      nameEl.className = 'name';
      nameEl.textContent = name;
      const metaEl = document.createElement('span');
      metaEl.className = 'meta';
      metaEl.textContent = meta;
      li.append(mark, nameEl, metaEl);
      if (ok && documentId) {
        li.dataset.documentId = documentId;
        const delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.title = 'Aus Kontext entfernen';
        delBtn.innerHTML = '<svg width="11" height="12" viewBox="0 0 11 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h9M4 3V2h3v1M2 3l.7 7.5h5.6L9 3"/></svg>';
        li.append(delBtn);
      }
      filesEl.prepend(li);
    }

    function renderGraph(data) {
      const nodes = (data.nodes || []).map(n => ({
        id: n.id,
        label: n.label,
        title: n.description ? `${n.type} — ${n.description}` : n.type,
      }));
      const edges = (data.edges || []).map(e => ({
        from: e.source,
        to: e.target,
        label: e.relation,
      }));

      if (nodes.length === 0) {
        if (network) { network.destroy(); network = null; }
        emptyEl.style.display = 'flex';
        return;
      }
      emptyEl.style.display = 'none';

      const visData = {
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges),
      };
      const options = {
        interaction: { hover: true, tooltipDelay: 100 },
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: { gravitationalConstant: -45, springLength: 110 },
          stabilization: { iterations: 250 },
        },
        nodes: {
          shape: 'dot',
          size: 14,
          borderWidth: 1,
          color: {
            background: '#1a2030',
            border: '#4a90e2',
            highlight: { background: '#243049', border: '#6fa8e8' },
          },
          font: { color: '#e4e6eb', size: 13, face: 'sans-serif' },
        },
        edges: {
          arrows: { to: { enabled: true, scaleFactor: 0.5 } },
          color: { color: '#3a4252', highlight: '#6fa8e8' },
          font: { color: '#6b7382', size: 10, strokeWidth: 0, align: 'middle' },
          smooth: { type: 'continuous' },
          width: 1,
        },
      };
      if (network) network.destroy();
      network = new vis.Network(graphEl, visData, options);
    }

    function graphSummary(data) {
      const n = (data.nodes || []).length;
      const e = (data.edges || []).length;
      return `${n} Entität${n === 1 ? '' : 'en'} · ${e} Relation${e === 1 ? '' : 'en'}`;
    }

    async function loadGraph() {
      try {
        const res = await fetch('/api/graph', { headers: sessionHeaders() });
        const data = await res.json();
        if (!res.ok) {
          setStatus(`Fehler: ${data.detail || res.statusText}`, 'error');
          return;
        }
        renderGraph(data);
        const summary = graphSummary(data);
        const n = (data.nodes || []).length;
        setStatus(n === 0 ? 'bereit' : summary);
      } catch (err) {
        setStatus(`Fehler: ${err.message}`, 'error');
      }
    }

    const STEP_LABELS_DE = {
      queued:     'Eingereiht',
      parsing:    'PDF wird gelesen',
      splitting:  'Text wird zerlegt',
      embedding:  'Embeddings werden berechnet',
      extracting: 'Entitäten werden extrahiert',
      persisting: 'Wird im Graph gespeichert',
      done:       'Fertig',
      error:      'Fehler',
    };
    const DETERMINATE_STEPS = new Set(['extracting', 'persisting']);
    const progressEl = document.getElementById('progress');
    const progressFill = progressEl.querySelector('.fill');
    const progressLabel = progressEl.querySelector('.label');
    let activePoll = null;
    const pendingFileEntries = new Map(); // documentId → <li> element

    function addFilePendingEntry(filename, documentId) {
      const li = document.createElement('li');
      li.dataset.documentId = documentId;
      const badge = document.createElement('span');
      badge.className = 'pending';
      badge.textContent = '·';
      const nameEl = document.createElement('span');
      nameEl.className = 'name';
      nameEl.textContent = filename;
      const metaEl = document.createElement('span');
      metaEl.className = 'meta';
      metaEl.textContent = 'eingereiht';
      li.append(badge, nameEl, metaEl);
      pendingFileEntries.set(documentId, li);
      return li;
    }

    const FILE_STATUS_LABELS = {
      queued: 'eingereiht',
      parsing: 'wird gelesen …',
      indexing: 'wird verarbeitet …',
      done: 'fertig',
    };

    function updateFilePendingEntry(documentId, status, errorMsg) {
      const li = pendingFileEntries.get(documentId);
      if (!li) return;
      const badge = li.querySelector('span:first-child');
      const metaEl = li.querySelector('.meta');
      if (status === 'done') {
        badge.className = 'ok';
        badge.textContent = '✓';
        if (metaEl) metaEl.textContent = 'fertig';
        if (!li.querySelector('.del')) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del';
          delBtn.title = 'Aus Kontext entfernen';
          delBtn.innerHTML = '<svg width="11" height="12" viewBox="0 0 11 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h9M4 3V2h3v1M2 3l.7 7.5h5.6L9 3"/></svg>';
          li.append(delBtn);
        }
        pendingFileEntries.delete(documentId);
      } else if (status === 'error') {
        badge.className = 'err';
        badge.textContent = '✕';
        if (metaEl) metaEl.textContent = errorMsg || 'Fehler';
        pendingFileEntries.delete(documentId);
      } else {
        badge.className = 'pending';
        badge.textContent = '·';
        if (metaEl) metaEl.textContent = FILE_STATUS_LABELS[status] || status;
      }
    }

    function showProgress(step, current, total) {
      progressEl.classList.add('visible');
      const isDeterminate = DETERMINATE_STEPS.has(step) && total > 0;
      progressEl.classList.toggle('indeterminate', !isDeterminate);
      if (isDeterminate) {
        const pct = Math.min(100, Math.round((current / total) * 100));
        progressFill.style.width = pct + '%';
        progressLabel.textContent = `${STEP_LABELS_DE[step] || step} · ${current}/${total}`;
      } else {
        progressFill.style.width = '0%';
        progressLabel.textContent = STEP_LABELS_DE[step] || step;
      }
    }

    function hideProgress() {
      progressEl.classList.remove('visible', 'indeterminate');
      progressFill.style.width = '0%';
      progressLabel.textContent = '';
    }

    async function upload(fileList) {
      const files = Array.from(fileList);
      if (files.length === 0) return;
      const nonPdfs = files.filter(f => !f.name.toLowerCase().endsWith('.pdf'));
      if (nonPdfs.length > 0) {
        setStatus('Nur PDF-Dateien erlaubt', 'error');
        return;
      }
      if (activePoll) {
        clearInterval(activePoll);
        activePoll = null;
      }
      const fd = new FormData();
      for (const f of files) fd.append('files', f);
      dropArea.classList.add('busy');
      setStatus(`Lade ${files.length} PDF${files.length > 1 ? 's' : ''} hoch …`, 'busy');
      showProgress('queued', 0, 0);
      let job;
      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: sessionHeaders(),
          body: fd,
        });
        job = await res.json();
        if (!res.ok) {
          hideProgress();
          dropArea.classList.remove('busy');
          for (let i = files.length - 1; i >= 0; i--) addFileEntry(files[i].name, job.detail || res.statusText, false);
          setStatus(`Fehler: ${job.detail || res.statusText}`, 'error');
          return;
        }
      } catch (err) {
        hideProgress();
        dropArea.classList.remove('busy');
        for (let i = files.length - 1; i >= 0; i--) addFileEntry(files[i].name, err.message, false);
        setStatus(`Fehler: ${err.message}`, 'error');
        return;
      }
      const frag = document.createDocumentFragment();
      for (const f of job.files) {
        textViewer.registerDoc(f.document_id, f.filename);
        frag.appendChild(addFilePendingEntry(f.filename, f.document_id));
      }
      filesEl.prepend(frag);
      pollJob(job.job_id, job.estimated_seconds || 120);
    }

    function pollJob(jobId, etaSec) {
      const intervalMs = 700;
      const hardCapMs = Math.max(etaSec * 1500, 15 * 60 * 1000); // mind. 15 Min Puffer
      const startedAt = Date.now();
      setStatus('Indexierung läuft …', 'busy');

      const tick = async () => {
        if (Date.now() - startedAt > hardCapMs) {
          clearInterval(activePoll);
          activePoll = null;
          hideProgress();
          dropArea.classList.remove('busy');
          pendingFileEntries.forEach((_, docId) => updateFilePendingEntry(docId, 'error', 'Zeitlimit überschritten'));
          setStatus('Job läuft länger als erwartet, prüfe Logs', 'error');
          return;
        }
        try {
          const res = await fetch(`/api/jobs/${jobId}`, { headers: sessionHeaders() });
          const data = await res.json();
          if (!res.ok) {
            clearInterval(activePoll);
            activePoll = null;
            hideProgress();
            dropArea.classList.remove('busy');
            pendingFileEntries.forEach((_, docId) => updateFilePendingEntry(docId, 'error', data.detail || res.statusText));
            setStatus(`Fehler: ${data.detail || res.statusText}`, 'error');
            return;
          }
          showProgress(data.step, data.current || 0, data.total || 0);
          if (Array.isArray(data.files)) {
            for (const f of data.files) updateFilePendingEntry(f.document_id, f.status, f.error);
          }
          if (data.status === 'done') {
            clearInterval(activePoll);
            activePoll = null;
            hideProgress();
            dropArea.classList.remove('busy');
            // Finalize any entries not yet marked done by on_file callbacks
            pendingFileEntries.forEach((_, docId) => updateFilePendingEntry(docId, 'done'));
            if (data.graph) renderGraph(data.graph);
            setStatus(data.graph ? graphSummary(data.graph) : 'Fertig');
          } else if (data.status === 'error') {
            clearInterval(activePoll);
            activePoll = null;
            hideProgress();
            dropArea.classList.remove('busy');
            pendingFileEntries.forEach((_, docId) => updateFilePendingEntry(docId, 'error', data.error || 'Indexierung fehlgeschlagen'));
            setStatus(`Fehler: ${data.error || 'Indexierung fehlgeschlagen'}`, 'error');
          }
        } catch (err) {
          // transienter Netzwerkfehler: Polling fortsetzen
          console.warn('Job polling failed, retry:', err.message);
        }
      };
      tick();
      activePoll = setInterval(tick, intervalMs);
    }

    function appendMessage(role, text, options = {}) {
      if (chatEmpty && chatEmpty.parentNode) chatEmpty.remove();
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      if (options.error) msg.classList.add('error');
      if (options.pending) msg.classList.add('pending');
      const renderMarkdown =
        role === 'assistant' && !options.pending && !options.error;
      if (renderMarkdown) {
        const body = document.createElement('div');
        body.className = 'msg-body';
        body.innerHTML = DOMPurify.sanitize(marked.parse(text || ''));
        const citations = Array.isArray(options.citations) ? options.citations : [];
        decorateCitations(body, citations);
        msg.appendChild(body);
      } else {
        msg.textContent = text;
      }
      if (options.meta) {
        const meta = document.createElement('div');
        meta.className = 'msg-meta';
        options.meta.forEach(([label, value]) => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = `${label}: ${value}`;
          meta.appendChild(chip);
        });
        msg.appendChild(meta);
      }
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msg;
    }

    function renderStreamingCitations(text, citations) {
      if (!citations || !citations.length) return text;
      const byIndex = new Map();
      citations.forEach(c => {
        if (c && typeof c.index === 'number' && c.document_id) byIndex.set(c.index, c);
      });
      if (!byIndex.size) return text;
      const displayNumberByIndex = new Map();
      let displayCounter = 0;
      // Strip trailing incomplete tag fragment (e.g. "[S" or "[S1") so it doesn't flash raw
      const displayText = text.replace(/\[S[^[\]]*$/, '');
      return displayText.replace(/\[S\d+(?:\s*,\s*S\d+)*\]/g, tag => {
        const ids = [...tag.matchAll(/S(\d+)/g)].map(m => parseInt(m[1], 10));
        const validIds = ids.filter(idx => byIndex.has(idx));
        if (!validIds.length) return '';
        const labels = validIds.map(idx => {
          if (!displayNumberByIndex.has(idx)) displayNumberByIndex.set(idx, ++displayCounter);
          return 'Q' + displayNumberByIndex.get(idx);
        });
        return '(' + labels.join('; ') + ')';
      });
    }

    function decorateCitations(body, citations) {
      if (!citations.length) return;
      const byIndex = new Map();
      citations.forEach(c => {
        if (c && typeof c.index === 'number') {
          byIndex.set(c.index, c);
          textViewer.registerDoc(c.document_id, c.title);
        }
      });
      if (!byIndex.size) return;
      const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) {
        if (/\[S\d+(?:\s*,\s*S\d+)*\]/.test(node.nodeValue)) textNodes.push(node);
      }
      const occurrenceCounter = new Map();
      const displayNumberByIndex = new Map();
      let displayCounter = 0;
      textNodes.forEach(textNode => {
        const parent = textNode.parentNode;
        if (!parent) return;
        const parts = textNode.nodeValue.split(/(\[S\d+(?:\s*,\s*S\d+)*\])/g);
        const frag = document.createDocumentFragment();
        parts.forEach(part => {
          if (!/^\[S/.test(part)) {
            frag.appendChild(document.createTextNode(part));
            return;
          }
          const ids = [...part.matchAll(/S(\d+)/g)].map(m => parseInt(m[1], 10));
          const validIds = ids.filter(idx => {
            const cite = byIndex.get(idx);
            return cite && cite.document_id;
          });
          if (!validIds.length) return;
          frag.appendChild(document.createTextNode('('));
          validIds.forEach((idx, i) => {
            const cite = byIndex.get(idx);
            if (i > 0) frag.appendChild(document.createTextNode('; '));
            const seen = occurrenceCounter.get(idx) || 0;
            occurrenceCounter.set(idx, seen + 1);
            const occ = cite.occurrences && cite.occurrences[seen];
            const snippet = (occ && occ.snippet) || cite.snippet;
            const a = document.createElement('a');
            a.className = 'cite';
            a.href = '#';
            a.dataset.index = String(idx);
            a.dataset.documentId = (occ && occ.document_id) || cite.document_id;
            a.dataset.page = String((occ && occ.page_number) || cite.page_number || 1);
            if (snippet) a.dataset.snippet = snippet;
            if (!displayNumberByIndex.has(idx)) { displayNumberByIndex.set(idx, ++displayCounter); }
            a.textContent = 'Q' + displayNumberByIndex.get(idx);
            a.title = (cite.title || 'Quelle') + ' · Seite ' + ((occ && occ.page_number) || cite.page_number || 1);
            frag.appendChild(a);
          });
          frag.appendChild(document.createTextNode(')'));
        });
        parent.replaceChild(frag, textNode);
      });
    }

    chatMessages.addEventListener('click', e => {
      const a = e.target.closest('a.cite');
      if (!a) return;
      e.preventDefault();
      if (a.classList.contains('broken')) return;
      const documentId = a.dataset.documentId;
      if (!documentId) return;
      const page = parseInt(a.dataset.page || '1', 10);
      textViewer.open(documentId, page, a.dataset.snippet || null);
    });

    function setChatBusy(busy) {
      chatBusy = busy;
      chatInput.disabled = busy;
      chatSend.disabled = busy;
    }

    async function sendChatMessage() {
      const question = chatInput.value.trim();
      if (!question || chatBusy) return;

      appendMessage('user', question);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      setChatBusy(true);
      setStatus('Frage wird verarbeitet …', 'busy');
      const pending = appendMessage('assistant', 'denke nach …', { pending: true });

      try {
        const res = await fetch('/api/query/stream', {
          method: 'POST',
          headers: sessionHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ question }),
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({ detail: res.statusText }));
          pending.remove();
          appendMessage('assistant', errData.detail || res.statusText, { error: true });
          setStatus(`Fehler: ${errData.detail || res.statusText}`, 'error');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = '';
        let eventType = null;
        let streamMeta = null;
        let tokens = '';
        let done = false;

        while (!done) {
          const { done: streamDone, value } = await reader.read();
          if (streamDone) break;
          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith('event: ')) {
              eventType = line.slice(7).trim();
            } else if (line.startsWith('data: ')) {
              let data;
              try { data = JSON.parse(line.slice(6)); } catch { continue; }
              if (eventType === 'meta') {
                streamMeta = data;
              } else if (eventType === 'token') {
                tokens += data.delta || '';
                const shown = renderStreamingCitations(tokens, streamMeta?.citations || []);
                pending.textContent = shown + '▌';
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else if (eventType === 'final') {
                pending.remove();
                const meta = [];
                if (streamMeta) {
                  if (typeof streamMeta.vector_chunks === 'number') meta.push(['Vector-Chunks', streamMeta.vector_chunks]);
                  if (typeof streamMeta.graph_chunks === 'number') meta.push(['Graph-Chunks', streamMeta.graph_chunks]);
                  if (Array.isArray(streamMeta.query_entities) && streamMeta.query_entities.length)
                    meta.push(['Entitäten', streamMeta.query_entities.join(', ')]);
                }
                appendMessage('assistant', data.answer || '(leere Antwort)', {
                  meta,
                  citations: streamMeta?.citations || [],
                });
                setStatus('Antwort geliefert');
                done = true;
              } else if (eventType === 'error') {
                pending.remove();
                appendMessage('assistant', data.detail || 'Fehler', { error: true });
                setStatus(`Fehler: ${data.detail || 'Fehler'}`, 'error');
                done = true;
              }
              eventType = null;
            }
          }
        }
      } catch (err) {
        pending.remove();
        appendMessage('assistant', err.message, { error: true });
        setStatus(`Fehler: ${err.message}`, 'error');
      } finally {
        setChatBusy(false);
        chatInput.focus();
      }
    }

    chatClear.addEventListener('click', () => {
      if (chatBusy) return;
      chatMessages.replaceChildren();
      const emptyDiv = document.createElement('div');
      emptyDiv.id = 'chat-empty';
      emptyDiv.textContent = 'Stelle eine Frage zu den indexierten PDFs.';
      chatMessages.appendChild(emptyDiv);
    });

    chatSend.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    });
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
    });

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      if (e.target.files.length > 0) upload(e.target.files);
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(evt => {
      dropArea.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropArea.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(evt => {
      dropArea.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropArea.classList.remove('over');
      });
    });
    dropArea.addEventListener('drop', e => {
      if (e.dataTransfer.files.length > 0) upload(e.dataTransfer.files);
    });
    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', e => e.preventDefault());

    function endSession() {
      const payload = JSON.stringify({ session_id: sessionId });
      const blob = new Blob([payload], { type: 'application/json' });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/session/end', blob);
      } else {
        fetch('/api/session/end', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true,
        }).catch(() => {});
      }
    }
    window.addEventListener('pagehide', endSession);

    loadGraph();
  </script>
</body>
</html>
